# Integración continua de APPWEB_AUTH (API FastAPI + panel "Ludoteca").
#
# 1. api-y-funcionales: levanta la API con una BD temporal, pasa la batería
#    de la API (tests/probar_api.py) y las pruebas funcionales con Selenium
#    en Chrome sin interfaz.
# 2. carga-humo: si lo anterior pasa, lanza una prueba de carga corta con
#    Locust y guarda el informe HTML como artefacto.
#
# El despliegue (CD) lo hace Render al recibir el push en main; este flujo
# sirve de "puerta de calidad" para detectar fallos antes o justo después.
name: Pruebas APPWEB_AUTH

on:
  push:
    branches: [main]
    paths: ["APPWEB_AUTH/**", ".github/workflows/pruebas-appweb.yml"]
  pull_request:
    paths: ["APPWEB_AUTH/**", ".github/workflows/pruebas-appweb.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: APPWEB_AUTH

jobs:
  api-y-funcionales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: APPWEB_AUTH/requirements-test.txt

      - name: Instalar dependencias
        run: pip install -r requirements-test.txt

      - name: Batería de la API (probar_api.py)
        run: |
          python tests/servidor_aislado.py --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/salud && break; sleep 1; done
          python tests/probar_api.py

      - name: Pruebas funcionales con Selenium (Chrome headless)
        run: pytest --junitxml=resultados-funcionales.xml

      - name: Guardar capturas e informe si algo falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-funcionales
          path: |
            APPWEB_AUTH/resultados-funcionales.xml
            APPWEB_AUTH/tests/funcionales/capturas/
          if-no-files-found: ignore

  carga-humo:
    needs: api-y-funcionales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: APPWEB_AUTH/requirements-test.txt

      - name: Instalar dependencias
        run: pip install -r requirements-test.txt

      - name: Prueba de carga corta (20 usuarios, 45 s)
        run: |
          python tests/servidor_aislado.py --port 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/salud && break; sleep 1; done
          mkdir -p informe
          # --exit-code-on-error 1: el job falla si alguna petición falla.
          locust -f tests/estres/locustfile.py --host http://127.0.0.1:8765 \
            --headless -u 20 -r 5 -t 45s --only-summary \
            --csv informe/carga --html informe/carga.html --exit-code-on-error 1

      - name: Publicar informe de Locust
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-carga
          path: APPWEB_AUTH/informe/
